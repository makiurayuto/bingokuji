<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#ffffff">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="おみくじ">
  <title>おみくじ</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main id="main-screen" class="screen">
    <header class="tools">
      <button id="undo" class="btn" type="button" disabled>1つ前に戻す</button>
      <button id="open-history" class="btn" type="button">履歴</button>
      <button id="open-settings" class="btn" type="button">設定</button>
    </header>
    <div class="main-body">
      <div id="result" class="result" aria-live="polite">
        <p id="result-rank" class="result-rank"></p>
        <p id="result-name" class="result-name"></p>
      </div>
      <button id="box" class="box" type="button" aria-label="おみくじを引く">
        <svg viewBox="0 0 120 120" aria-hidden="true">
          <g stroke="#000" stroke-width="3" stroke-linejoin="round">
            <polygon points="20,40 60,58 60,108 20,90" fill="#eee"/>
            <polygon points="60,58 100,40 100,90 60,108" fill="#fff"/>
            <polygon points="20,40 60,22 100,40 60,58" fill="#fff"/>
          </g>
          <ellipse cx="60" cy="40" rx="12" ry="5.5" fill="#000"/>
        </svg>
      </button>
      <p id="remaining" class="remaining"></p>
      <p id="message" class="message" role="status"></p>
    </div>
  </main>

  <section id="history-screen" class="screen" hidden>
    <header class="bar">
      <button id="close-history" class="btn" type="button">戻る</button>
      <h1>履歴</h1>
      <span></span>
    </header>
    <p id="history-empty" class="message" hidden>履歴はありません</p>
    <ol id="history-list" class="history-list"></ol>
  </section>

  <section id="settings-screen" class="screen" hidden>
    <header class="bar">
      <button id="close-settings" class="btn" type="button">戻る</button>
      <h1>設定</h1>
      <span></span>
    </header>
    <p id="settings-error" class="message error" role="alert"></p>
    <ul id="prize-list" class="prize-list"></ul>
    <form id="add-form" class="prize-row add-row" autocomplete="off">
      <input name="name" class="name" type="text" placeholder="景品名" maxlength="50" aria-label="追加する景品名">
      <div class="row-controls">
        <select name="rank" aria-label="追加する景品のランク"></select>
        <select name="remaining" class="count" aria-label="追加する景品の個数"></select>
        <button class="btn primary" type="submit">追加</button>
      </div>
    </form>
  </section>

  <script type="module" src="js/app.js"></script>
</body>
</html>
